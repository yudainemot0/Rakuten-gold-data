# 楽天GOLD 店舗トップ用データの自動更新（GitHub Pages配信方式）
# 役割: 1日1回、既存GASから商品データJSONを取得し、リポジトリの data/ にコミットする。
#       コミットされたJSONは GitHub Pages が配信し、ブラウザ(rankingheader.js)はそれを読む。
#       （楽天GOLDのFTPは外部IPを拒否するため使わない）
#
# 置き場所: .github/workflows/update-data.yml
#
# 必要なSecrets（Settings → Secrets and variables → Actions）:
#   GAS_URL … GASウェブアプリのURL（.../exec まで。パラメータは付けない）
#   ※ FTP_* のSecretはこの方式では不要（消してOK）
#
# 事前準備（GitHub側）:
#   1) リポジトリを Public にする
#   2) Settings → Pages → Source を「Deploy from a branch」、Branch を main / (root) にする
#   公開URLは https://yudainemot0.github.io/Rakuten-gold-data/data/xxx.json になる

name: Update storefront data

on:
  schedule:
    # 毎日 UTC 20:30 = JST 翌 5:30。GAS側の saveSnapshot / updateLiveItemList より後に回すこと。
    - cron: "30 20 * * *"
  workflow_dispatch: {} # 手動実行も可能（Actionsタブ → Run workflow）

# リポジトリへコミットするための書き込み権限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch JSON from GAS
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          set -e
          mkdir -p data

          # $1 = GASに付けるクエリ, $2 = 出力ファイル名
          fetch() {
            for i in 1 2 3; do
              if curl -fsSL --max-time 180 "${GAS_URL}$1" -o "data/$2"; then
                # JSON配列([...])で始まるか検査。GASのエラー {"error":...} を弾き、
                # 壊れたデータで既存の正常JSONを上書きしないため（失敗時はコミットしない）。
                first=$(head -c1 "data/$2" | tr -d '[:space:]')
                if [ "$first" = "[" ]; then
                  echo "OK: $2 ($(wc -c < "data/$2") bytes)"
                  return 0
                fi
                echo "not-an-array (retry $i): $2 -> $(head -c120 "data/$2")"
              else
                echo "curl failed (retry $i): $2"
              fi
              sleep 15
            done
            echo "FAILED: $2"
            return 1
          }

          fetch "?type=ranking"   ranking.json
          fetch "?t=$(date +%s)"  items.json
          fetch "?type=livecodes" livecodes.json

          # Jekyll処理を無効化（JSONをそのまま配信）
          touch .nojekyll

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json .nojekyll
          if git diff --cached --quiet; then
            echo "変更なし（コミットしません）"
          else
            git commit -m "data: 自動更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
